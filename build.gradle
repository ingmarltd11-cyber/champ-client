import net.fabricmc.loom.api.mappings.layered.MappingsNamespace

plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.version
group = project.group

loom {
    mods {
        champplus {
            sourceSet sourceSets.main
        }
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "champ.refmap.json"
        add(sourceSets.main)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Dear ImGui + Netty proxy: compile deps here ...
    def imguiVersion = "1.90.0"
    ["imgui-java-binding", "imgui-java-lwjgl3",
     "imgui-java-natives-windows", "imgui-java-natives-linux", "imgui-java-natives-macos"].each {
        modImplementation "io.github.spair:${it}:${imguiVersion}"
    }
    def nettyVersion = "4.2.7.Final"
    ["netty-handler-proxy", "netty-codec-socks"].each {
        modImplementation "io.netty:${it}:${nettyVersion}"
    }
}

// ... and nested manually below. (Loom's `include` double-embeds:
// processIncludeJars nests them into the jar AND remapJar nests the same
// set again -> "already contains entry".)
configurations {
    nest {
        canBeResolved = true
        canBeConsumed = false
        transitive = true
    }
}

dependencies {
    def imguiVersion = "1.90.0"
    ["imgui-java-binding", "imgui-java-lwjgl3",
     "imgui-java-natives-windows", "imgui-java-natives-linux", "imgui-java-natives-macos"].each {
        nest "io.github.spair:${it}:${imguiVersion}"
    }
    def nettyVersion = "4.2.7.Final"
    nest "io.netty:netty-handler-proxy:${nettyVersion}"
    nest "io.netty:netty-codec-socks:${nettyVersion}"
}

tasks.named("jar", Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.nest) {
        into "META-INF/jars"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Pre-flight: controleert mixin-selectors tegen de echte Minecraft-classes,
// zodat een verkeerde descriptor niet pas bij het opstarten crasht.
tasks.register("validateMixins", Exec) {
    group = "verification"
    description = "Validate mixin selectors/handlers against Minecraft classes"
    doFirst {
        def jars = loom.getMinecraftJars(MappingsNamespace.NAMED)
        commandLine "node", "tools/ValidateMixins.mjs", "src/main/java", jars.first().toAbsolutePath().toString()
    }
}

tasks.named("check") {
    dependsOn "validateMixins"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
